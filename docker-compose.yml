# Shipwright: web (Next.js) + db (PostgreSQL with pgvector) + planner (NetworkX)
#   docker compose up -d --build --wait      then open http://localhost:3000
# No .env file is needed to start: every variable below has a default. Copy .env.example to .env
# to set keys and the database password.
name: concept-to-realization
services:
  db:
    # PostgreSQL 19 (the current release, 19 November 2026) with pgvector 0.8.7, the current pgvector.
    # The tag is checked to exist on Docker Hub by the CI "stack" job.
    image: ${PG_IMAGE:-pgvector/pgvector:0.8.7-pg19-trixie}
    # Settings for vector search, each with its reason and the measurement behind it in
    # docs/design/vector-search.md. Sized for a machine that gives Docker 4 GB or more (Docker Desktop: Settings,
    # Resources, Memory); with less, lower them in .env as .env.example shows. Docker itself sets no memory limit here.
    command:
      - postgres
      # pgvector: about a quarter of the memory. PostgreSQL's own default is 128MB.
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      # An index build is fast only while its graph fits here. Measured at 4,096 numbers per vector,
      # 20,000 rows: 143 s at the default 64MB, 11 s at 1GB.
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-1GB}
      - -c
      - max_parallel_maintenance_workers=${PG_MAX_PARALLEL_MAINTENANCE_WORKERS:-4}
      # Sorting the re-ranked candidates, and the ceiling for pgvector's iterative scans.
      - -c
      - work_mem=${PG_WORK_MEM:-32MB}
      # The data is on solid-state storage, where reading a page out of order costs about the same as
      # reading the next one. PostgreSQL's default of 4 assumes a spinning disk and makes it avoid indexes.
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
    # Parallel index builds and parallel scans share memory through /dev/shm, which Docker limits to
    # 64 MB unless told otherwise; an index build with maintenance_work_mem above that would fail.
    shm_size: ${PG_SHM_SIZE:-1gb}
    environment:
      POSTGRES_DB: c2r
      POSTGRES_USER: c2r
      POSTGRES_PASSWORD: ${PGPASSWORD:-c2r}
    volumes:
      # PostgreSQL 18+ images set PGDATA=/var/lib/postgresql/<major>/docker and declare
      # /var/lib/postgresql as the volume, so the whole of /var/lib/postgresql is mounted.
      # The CI "stack" job asserts PGDATA lies inside this mount and that data survives a restart.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 checks the TCP listener the other containers use, not only the socket
      # the image's init scripts use while the database is still being created.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U c2r -d c2r"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  planner:
    build: ./planner
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    restart: unless-stopped

  # Plan 6.5: OrcaSlicer behind a small HTTP wrapper, for the print flow. Off by default (the image is large and downloads
  # OrcaSlicer at build time): `docker compose --profile slicer up -d --build`. The web service looks for it at http://slicer:8000 (change it in Admin, Printers).
  slicer:
    profiles: ["slicer"]
    # Built for this machine's architecture: OrcaSlicer 2.5.0 has official x86-64 and aarch64 builds (slicer/Dockerfile).
    build: ./slicer
    restart: unless-stopped

  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # The owner (migrations, seeding, sign-in tables) and the request role, which owns nothing and cannot read
      # passwords or tokens. The app creates the request role with this password on its first start if it is missing
      # (docs/guide/admin.md, "Two database roles"). Leave DATABASE_APP_URL out to run everything as the owner.
      DATABASE_URL: postgresql://c2r:${PGPASSWORD:-c2r}@db:5432/c2r
      DATABASE_APP_URL: postgresql://c2r_app:${PGAPPPASSWORD:-c2r_app}@db:5432/c2r
      PLANNER_URL: http://planner:8000
      # the compose slicer service; without the slicer profile the app reports it as not reachable and print jobs wait
      SLICER_URL: ${SLICER_URL:-http://slicer:8000}
    # Published on this machine only by default. WEB_BIND=0.0.0.0 opens it to the network: change the demo / demo
    # password first (docs/guide/admin.md, "Opening it to the network").
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      planner:
        condition: service_healthy
    healthcheck:
      # The image has no curl or wget; Node 22 has fetch. /api/health needs no sign-in and reads
      # the database, so healthy means the app answers and can reach its data.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 6s
      retries: 24
      start_period: 10s
    # lets the container reach a printer or OctoPrint on the host's network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  pgdata: {}
