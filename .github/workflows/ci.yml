name: CI

on:
  push:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: c2r
          POSTGRES_PASSWORD: c2r
          POSTGRES_DB: c2r_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U c2r -d c2r_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://c2r:c2r@localhost:5432/c2r_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: planner/requirements-dev.txt
      - run: python -m pip install -r planner/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: planner
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
